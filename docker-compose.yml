services:
  postgres:
    image: postgres:16-alpine
    container_name: darun_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: darundev
      POSTGRES_PASSWORD: darundev
      POSTGRES_DB: darundev
    ports:
      - "5434:5432" # host 5434 -> container 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: darun_redis
    restart: unless-stopped
    ports:
      - "6380:6379" # host 6380 -> container 6379

volumes:
  pgdata:
