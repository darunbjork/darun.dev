version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: darundev_postgres
    environment:
      POSTGRES_USER: darundev
      POSTGRES_PASSWORD: darundev
      POSTGRES_DB: darundev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darundev -d darundev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: darundev_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
