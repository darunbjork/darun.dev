name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint → Type-check → Test → Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: darundev
          POSTGRES_PASSWORD: darundev
          POSTGRES_DB: darundev_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://darundev:darundev@localhost:5432/darundev_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-32-chars-minimum-abc
      JWT_EXPIRES_IN: 7d
      GEMINI_API_KEY: test-key
      RESEND_API_KEY: test-key
      RESEND_FROM: test@darun.dev
      FRONTEND_URL: http://localhost:5173
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: |
          cd packages/api
          pnpm exec prisma generate

      - name: Lint
        run: pnpm turbo lint

      - name: Type-check
        run: pnpm turbo type-check

      - name: Migrate (test DB)
        run: |
          cd packages/api
          pnpm exec prisma migrate deploy

      - name: Test
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build
